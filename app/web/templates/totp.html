{% extends "_auth.html" %}
{% block title %}Código do autenticador{% endblock %}
{% block content %}
<h1>Código do autenticador</h1>
<p>Abra o aplicativo autenticador do celular e digite o código de 6 dígitos.</p>
<form method="post" action="/login/totp">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Código <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required autofocus></label>
  <button>Entrar</button>
</form>
<p class="dica">Perdeu o celular? Peça ao suporte para redefinir o autenticador.</p>
{% endblock %}
