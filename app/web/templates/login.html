{% extends "_auth.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<h1>Entrar no painel</h1>
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>E-mail <input type="email" name="email" autocomplete="username" required autofocus></label>
  <label>Senha <input type="password" name="password" autocomplete="current-password" required></label>
  <button>Continuar</button>
</form>
<p><a href="/senha/esqueci">Esqueci a senha</a></p>
<p class="dica"><a href="/ajuda">Ajuda</a> · <a href="/termos">Termos</a> · <a href="/politica-de-privacidade">Privacidade</a> · <a href="/status">Status</a></p>
{% endblock %}
