<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Painel{% endblock %} · Rental Desk</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="/static/painel.css">
  <script src="/static/htmx-2.0.4.min.js" defer></script>
</head>
<body hx-headers='{"x-csrf-token": "{{ csrf }}"}'>
  <header class="topo">
    <a class="marca" href="/">Rental Desk</a>
    {% if session %}
    <nav>
      {% block nav %}{% endblock %}
      <form method="post" action="/sair" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link">Sair</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="{% block main_class %}conteudo{% endblock %}">
    {% if notice %}<p class="aviso ok" role="status">{{ notice }}</p>{% endif %}
    {% if error %}<p class="aviso erro" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
