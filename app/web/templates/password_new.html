{% extends "_auth.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p class="dica">Pelo menos 12 caracteres. Uma frase curta funciona bem.</p>
<form method="post" action="{{ action }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Senha <input type="password" name="password" autocomplete="new-password" minlength="12" required autofocus></label>
  <button>Salvar</button>
</form>
{% endblock %}
