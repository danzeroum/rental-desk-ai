{% extends "_auth.html" %}
{% block title %}Esqueci a senha{% endblock %}
{% block content %}
<h1>Esqueci a senha</h1>
{% if sent %}
<p>Se o e-mail estiver cadastrado, enviamos um link válido por 1 hora.</p>
<p><a href="/login">Voltar ao login</a></p>
{% else %}
<form method="post" action="/senha/esqueci">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>E-mail <input type="email" name="email" autocomplete="username" required autofocus></label>
  <button>Enviar link</button>
</form>
{% endif %}
{% endblock %}
