name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff, mypy, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uvx --from shellcheck-py==0.11.0.1 shellcheck deploy/*.sh deploy/backup/*.sh deploy/postgres/*.sh

  test:
    name: Testes (unidade + integração)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentaldesk_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://rentaldesk_app:app_pw@localhost:55432/rentaldesk_test
      TEST_DATABASE_MIGRATION_URL: postgresql://rentaldesk_owner:owner_pw@localhost:55432/rentaldesk_test
      TEST_DATABASE_OPS_URL: postgresql://rentaldesk_ops:ops_pw@localhost:55432/rentaldesk_test
      TEST_REDIS_URL: redis://localhost:56379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Cria os papéis do banco
        env:
          PGHOST: localhost
          PGPORT: "55432"
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: rentaldesk_test
          DB_OWNER_PASSWORD: owner_pw
          DB_APP_PASSWORD: app_pw
          DB_OPS_PASSWORD: ops_pw
        run: ./deploy/postgres/init-roles.sh
      - name: Migrações (ida e volta)
        env:
          DATABASE_MIGRATION_URL: ${{ env.TEST_DATABASE_MIGRATION_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest tests/unit tests/integration --cov --cov-report=term-missing --cov-report=xml
      - name: Cobertura dos módulos centrais (SPEC, seção 5)
        run: make coverage-core
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Segurança (pip-audit, bandit, semgrep, gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: pip-audit (dependências de produção)
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt -o requirements.txt
          uv run pip-audit --strict -r requirements.txt
      - name: bandit
        run: uv run bandit -q -c pyproject.toml -r app
      - name: semgrep
        run: >-
          uvx semgrep==1.186.0 scan --error --metrics=off
          --config p/python --config p/dockerfile --config p/secrets
          app deploy migrations
      - name: gitleaks (histórico completo)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --verbose

  image:
    name: Imagem e teste de fumaça
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - name: Gera .env de teste
        run: ENV=development DOMAIN=localhost APP_VERSION=ci-${{ github.sha }} ./deploy/gen-env.sh .env
      - name: Sobe o sistema (make up)
        run: make up
      - name: Migrações
        run: make migrate
      - name: /health pelo Caddy (HTTPS)
        run: |
          for i in $(seq 1 30); do
            if curl -fsk https://localhost/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Backup cifrado
        run: make backup
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --project-directory . -f deploy/docker-compose.yml --env-file .env logs --tail=200
