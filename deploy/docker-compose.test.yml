# Dependências para `make test` fora do Docker. Senhas fixas: só para testes locais.
name: rental-desk-ai-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rentaldesk_test
      DB_OWNER_PASSWORD: owner_pw
      DB_APP_PASSWORD: app_pw
      DB_OPS_PASSWORD: ops_pw
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentaldesk_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
